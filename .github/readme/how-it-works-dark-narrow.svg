<svg xmlns="http://www.w3.org/2000/svg" width="520" height="522" viewBox="0 0 520 522" role="img" aria-label="Plug in the macropad and press Flash keyboard.: This writes a unique code for every key into the keyboard's own memory. It only has to be done once, and it survives without the app. Click any key or knob and pick what it does.: To open a program, type its name and pick it from the list of what you have installed (icon included), or press the folder to browse for the file. Press Test to try it right away. Settings &gt; &quot;Start with Windows&quot; and forget about it.: The listener starts with Windows, so your keys answer with this window closed and after a restart."><g transform="translate(8 8) scale(2)"><g fill="none" stroke="#5081be" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><circle cx="10" cy="7" r="1"/><circle cx="4" cy="20" r="1"/><path d="M4.7 19.3L19 5m2-2l-3 1l2 2ZM9.26 7.68L5 12l2 5m3-3l5 2l3.5-3.5"/><path d="m18 12l1-1l1 1l-1 1Z"/></g></g><text x="80" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">Plug in the macropad and press</text><text x="80" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">Flash keyboard.</text><text x="80" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">This writes a unique code for every</text><text x="80" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">key into the keyboard's own memory.</text><path d="M32 68 V174" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M26 166 L32 174 L38 166" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(8 186) scale(