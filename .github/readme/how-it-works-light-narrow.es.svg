<svg xmlns="http://www.w3.org/2000/svg" width="520" height="551" viewBox="0 0 520 551" role="img" aria-label="Enchufa el macropad y pulsa Flashear teclado.: Eso graba un código único por tecla en la memoria del propio teclado. Solo hay que hacerlo una vez y persiste sin la app. Haz clic en una tecla o perilla y elige qué hace.: Para abrir un programa, escribe su nombre y elígelo de la lista de lo que tienes instalado (sale con su icono), o pulsa la carpeta para buscar el archivo. Pulsa Probar para verlo al momento. Ajustes &gt; «Arrancar con Windows» y olvídate.: El listener arranca con Windows, así que tus teclas responden con esta ventana cerrada y después de reiniciar."><g transform="translate(8 8) scale(2)"><g fill="none" stroke="#0B4FA4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><circle cx="10" cy="7" r="1"/><circle cx="4" cy="20" r="1"/><path d="M4.7 19.3L19 5m2-2l-3 1l2 2ZM9.26 7.68L5 12l2 5m3-3l5 2l3.5-3.5"/><path d="m18 12l1-1l1 1l-1 1Z"/></g></g><text x="80" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Enchufa el macropad y pulsa</text><text x="80" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Flashear teclado.</text><text x="80" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">Eso graba un código único por tecla</text><text x="80" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">en la memoria del propio teclado.</text><path d="M32 68 V174" stroke="#d1d9e0" stroke-width="2" fill="none"/><path d="M26 166 L32 174 L38 166" stroke="#d1d9e0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(8 186) scale(2)"><g fill="none" stroke="#0B4FA4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M10 8h.01M12 12h.01M14 8h.01M16 12h.01M18 8h.01M6 8h.01M7 16h10m-9-4h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></g></g><text x="80" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Haz clic en una tecla o</text><text x="80" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">perilla y elige qué hace.</text><text x="80" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">Para abrir un programa.</text><path d="M32 246 V323" stroke="#d1d9e0" stroke-width="2" fill="none"/><path d="M26 315 L32 323 L38 315" stroke="#d1d9e0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(8 335) scale(2)"><path fill="none" stroke="#0B4FA4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M12 2v10m6.4-5.4a9 9 0 1 1-12.77.04"/></g><text x="80" y="361" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Ajustes &gt; «Arrancar con</text><text x="80" y="395" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Windows» y olvídate.</text><text x="80" y="429" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">El listener arranca con Windows, así</text><text x="80" y="458" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">que tus teclas responden con esta</text><text x="80" y="487" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">ventana cerrada y después de</text><text x="80" y="516" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">reiniciar.</text></svg>