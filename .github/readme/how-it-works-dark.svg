<svg xmlns="http://www.w3.org/2000/svg" width="960" height="275" viewBox="0 0 960 275" role="img" aria-label="Plug in the macropad and press Flash keyboard.: This writes a unique code for every key into the keyboard's own memory. It only has to be done once, and it survives without the app. Click any key or knob and pick what it does.: To open a program, type its name and pick it from the list of what you have installed (icon included), or press the folder to browse for the file. Press Test to try it right away. Settings &gt; &quot;Start with Windows&quot; and forget about it.: The listener starts with Windows, so your keys answer with this window closed and after a restart."><g transform="translate(134 8) scale(2.1667)"><g fill="none" stroke="#5081be" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><circle cx="10" cy="7" r="1"/><circle cx="4" cy="20" r="1"/><path d="M4.7 19.3L19 5m2-2l-3 1l2 2ZM9.26 7.68L5 12l2 5m3-3l5 2l3.5-3.5"/><path d="m18 12l1-1l1 1l-1 1Z"/></g></g><text x="160" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Plug in the macropad and</text><text x="160" y="130" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">press Flash keyboard.</text><text x="160" y="164" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">This writes a unique code for</text><text x="160" y="189" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">every key into the keyboard's own</text><text x="160" y="214" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">memory.</text><path d="M206 34 H432" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M425 28 L434 34 L425 40" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(454 8) scale(2.1667)"><g fill="none" stroke="#5081be" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M10 8h.01M12 12h.01M14 8h.01M16 12h.01M18 8h.01M6 8h.01M7 16h10m-9-4h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></g></g><text x="480" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Click any key or knob and</text><text x="480" y="130" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">pick what it does.</text><text x="480" y="164" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">To open a program.</text><path d="M526 34 H752" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M745 28 L754 34 L745 40" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(774 8) scale(2.1667)"><path fill="none" stroke="#5081be" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M12 2v10m6.4-5.4a9 9 0 1 1-12.77.04"/></g><text x="800" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Settings &gt; &quot;Start with</text><text x="800" y="130" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Windows&quot; and forget about</text><text x="800" y="160" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">it.</text><text x="800" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">The listener starts with Windows,</text><text x="800" y="219" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">so your keys answer with this</text><text x="800" y="244" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">window closed and after a restart.</text></svg>