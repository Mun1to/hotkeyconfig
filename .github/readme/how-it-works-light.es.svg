<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-label="Enchufa el macropad y pulsa Flashear teclado.: Eso graba un código único por tecla en la memoria del propio teclado. Solo hay que hacerlo una vez y persiste sin la app. Haz clic en una tecla o perilla y elige qué hace.: Para abrir un programa, escribe su nombre y elígelo de la lista de lo que tienes instalado (sale con su icono), o pulsa la carpeta para buscar el archivo. Pulsa Probar para verlo al momento. Ajustes &gt; «Arrancar con Windows» y olvídate.: El listener arranca con Windows, así que tus teclas responden con esta ventana cerrada y después de reiniciar."><g transform="translate(134 8) scale(2.1667)"><g fill="none" stroke="#0B4FA4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><circle cx="10" cy="7" r="1"/><circle cx="4" cy="20" r="1"/><path d="M4.7 19.3L19 5m2-2l-3 1l2 2ZM9.26 7.68L5 12l2 5m3-3l5 2l3.5-3.5"/><path d="m18 12l1-1l1 1l-1 1Z"/></g></g><text x="160" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#1f2328">Enchufa el macropad y</text><text x="160" y="130" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#1f2328">pulsa Flashear teclado.</text><text x="160" y="164" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">Eso graba un código único por</text><text x="160" y="189" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">tecla en la memoria del propio</text><text x="160" y="214" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="1